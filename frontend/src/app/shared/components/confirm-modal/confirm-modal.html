<div class="modal-overlay" *ngIf="visible" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ data?.title || 'Confirmar' }}</h3>
      <button class="btn-close" (click)="cancel()">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ data?.message || 'Tem certeza que deseja continuar?' }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="cancel()">
        {{ data?.cancelText || 'Cancelar' }}
      </button>
      <button class="btn btn-danger" (click)="confirm()">
        {{ data?.confirmText || 'Confirmar' }}
      </button>
    </div>
  </div>
</div>
