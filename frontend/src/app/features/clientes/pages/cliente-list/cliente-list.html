<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">👥 Lista de Clientes</h2>
      <a routerLink="/clientes/novo" class="btn btn-success">➕ Novo Cliente</a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!clientes" class="loading-spinner">
      Carregando clientes...
    </div>

    <div class="table-container">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Telefone</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td data-label="ID">{{ c.id }}</td>
        <td data-label="Nome">{{ c.nome }}</td>
        <td data-label="Email">{{ c.email }}</td>
        <td data-label="Telefone">{{ c.telefone || '-' }}</td>
        <td data-label="Status">
          <span class="badge" [ngClass]="c.ativo ? 'badge-success' : 'badge-danger'">
            {{ c.ativo ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
        <td data-label="Ações" class="acoes">
          <button class="btn btn-md btn-primary" [routerLink]="['/clientes/editar', c.id]">✏️</button>
          <button class="btn btn-md btn-danger" (click)="deletar(c.id!)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
    
    <!-- Empty state -->
    <div *ngIf="clientes && clientes.length === 0" class="empty-state">
      Nenhum cliente cadastrado. Clique em "Novo Cliente" para começar!
    </div>
  </div>
</div>
