<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">👫🏻 Lista de Clientes</h2>
      <a mat-raised-button color="success" routerLink="/clientes/novo"> ➕ Novo Cliente </a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!dataSource.data.length && !loading" class="loading-spinner">
      Carregando clientes...
    </div>

    <!-- Campo de filtro (opcional) -->
    <div class="filter-container">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filtrar</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Digite para filtrar..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <!-- Tabela Material -->
    <div class="">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0">
        <!-- Coluna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <!-- Coluna Nome -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
          <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
        </ng-container>

        <!-- Coluna Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <!-- Coluna Telefone -->
        <ng-container matColumnDef="telefone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let row">{{ row.telefone || '-' }}</td>
        </ng-container>

        <!-- Coluna Status -->
        <ng-container matColumnDef="ativo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-badge" [class.ativo]="row.ativo" [class.inativo]="!row.ativo">
              {{ row.ativo ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
        </ng-container>

        <!-- Coluna Ações -->
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button color="primary" [routerLink]="['/clientes/editar', row.id]">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletar(row.id!)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Linha do cabeçalho -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <!-- Linhas de dados -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Linha quando não há dados -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="empty-state">Nenhum cliente encontrado.</div>
          </td>
        </tr>
      </table>

      <!-- Paginador -->
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
