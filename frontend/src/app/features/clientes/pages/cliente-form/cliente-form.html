<div class="container">
  <div class="card">
    <h2 class="mb-4">{{ editando ? '✏️ Editar' : '➕ Novo' }} Cliente</h2>

    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">
      Carregando dados do cliente...
    </div>

    <!-- Formulário -->
    <form *ngIf="!loading" (ngSubmit)="salvar()" #clienteForm="ngForm">
      <div class="form-group">
        <label class="form-label">
          Nome *
          <span class="text-muted">(obrigatório)</span>
        </label>
        <input 
          type="text" 
          class="form-control"
          [class.error]="nomeInput.invalid && nomeInput.touched"
          [(ngModel)]="cliente.nome" 
          name="nome"
          #nomeInput="ngModel"
          required
          placeholder="Digite o nome completo">
        <div *ngIf="nomeInput.invalid && nomeInput.touched" class="error-message">
          Nome é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          Email *
          <span class="text-muted">(obrigatório e único)</span>
        </label>
        <input 
          type="email" 
          class="form-control"
          [class.error]="emailInput.invalid && emailInput.touched"
          [(ngModel)]="cliente.email" 
          name="email"
          #emailInput="ngModel"
          required
          email
          placeholder="email@exemplo.com">
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          <div *ngIf="emailInput.errors?.['required']">Email é obrigatório</div>
          <div *ngIf="emailInput.errors?.['email']">Email inválido</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input 
          type="text" 
          class="form-control"
          [(ngModel)]="cliente.telefone" 
          name="telefone"
          placeholder="(11) 99999-9999">
      </div>

      <div class="form-checkbox mb-4">
        <input 
          type="checkbox" 
          [(ngModel)]="cliente.ativo" 
          name="ativo"
          id="ativo">
        <label for="ativo">Cliente Ativo</label>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-success" 
          [disabled]="loading || clienteForm.invalid">
          {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
        </button>
        <button type="button" class="btn btn-secondary" routerLink="/clientes">
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
