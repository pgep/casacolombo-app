<div class="container">
  <h2>{{ editando ? '✏️ Editar' : '➕ Novo' }} Cliente</h2>

  <form (ngSubmit)="salvar()">
    <div class="form-group">
      <label>Nome:</label>
      <input type="text" [(ngModel)]="cliente.nome" name="nome" required>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="cliente.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Telefone:</label>
      <input type="text" [(ngModel)]="cliente.telefone" name="telefone">
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" [(ngModel)]="cliente.ativo" name="ativo">
        Ativo
      </label>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-success">💾 Salvar</button>
      <button type="button" class="btn btn-secondary" routerLink="/clientes">❌ Cancelar</button>
    </div>
  </form>
</div>
