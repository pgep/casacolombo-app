<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">🔧 Lista de Ferramentas</h2>
      <a routerLink="/ferramentas/novo" class="btn btn-success">➕ Nova Ferramenta</a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!ferramentas" class="loading-spinner">
      Carregando ferramentas...
    </div>

    <!-- Tabela de ferramentas (responsiva) -->
    <div class="table-responsive" *ngIf="ferramentas && ferramentas.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Unidade</th>
            <th>Quantidade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of ferramentas">
            <td data-label="ID">{{ f.id }}</td>
            <td data-label="Nome">{{ f.nome }}</td>
            <td data-label="Unidade">{{ f.unidadeMedida || '-' }}</td>
            <td data-label="Quantidade">{{ f.quantidadeEmEstoque }}</td>
            <td data-label="Ações" class="acoes-cell">
              <div class="acoes-container">
                <button class="btn btn-sm btn-primary" [routerLink]="['/ferramentas/editar', f.id]">
                  ✏️
                </button>
                <button class="btn btn-sm btn-danger" (click)="deletar(f.id!)">
                  🗑️
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div *ngIf="ferramentas && ferramentas.length === 0" class="empty-state">
      <p>Nenhuma ferramenta cadastrada.</p>
      <a routerLink="/ferramentas/novo" class="btn btn-success">➕ Cadastrar Primeira Ferramenta</a>
    </div>
  </div>
</div>
