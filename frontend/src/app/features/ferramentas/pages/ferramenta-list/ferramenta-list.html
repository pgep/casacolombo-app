<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">🔧 Lista de Ferramentas</h2>
      <a mat-raised-button color="success" routerLink="/ferramentas/novo"> ➕ Nova Ferramenta </a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!dataSource.data.length && !loading" class="loading-spinner">
      Carregando ferramentas...
    </div>

    <!-- Tabela Material -->
    <mat-card class="example-card" appearance="outlined">
      <mat-card-header>
        <!-- Campo de filtro -->
        <div class="filter-container">
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Filtrar</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Digite para filtrar..." />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0">
          <!-- Coluna ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row" data-label="ID">{{ row.id }}</td>
          </ng-container>

          <!-- Coluna Nome -->
          <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
            <td mat-cell *matCellDef="let row" data-label="Nome">{{ row.nome }}</td>
          </ng-container>

          <!-- Coluna Unidade de Medida -->
          <ng-container matColumnDef="unidademedida">
            <th mat-header-cell *matHeaderCellDef>Unidade</th>
            <td mat-cell *matCellDef="let row" data-label="Unidade">
              {{ row.unidademedida || '-' }}
            </td>
          </ng-container>

          <!-- Coluna Quantidade em Estoque -->
          <ng-container matColumnDef="quantidadeemestoque">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantidade</th>
            <td mat-cell *matCellDef="let row" data-label="Quantidade">
              {{ row.quantidadeemestoque }}
            </td>
          </ng-container>

          <!-- Coluna Ações -->
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let row" data-label="Ações">
              <button
                mat-icon-button
                color="primary"
                [routerLink]="['/ferramentas/editar', row.id]"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deletar(row.id!)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- Linha do cabeçalho -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

          <!-- Linhas de dados -->
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Linha quando não há dados -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="empty-state">Nenhuma ferramenta encontrada.</div>
            </td>
          </tr>
        </table>
      </mat-card-content>
    </mat-card>

    <!-- Paginador -->
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
