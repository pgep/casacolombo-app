<div class="container">
  <div class="card">
    <h2 class="mb-4">{{ editando ? '✏️ Editar' : '➕ Nova' }} Ferramenta</h2>

    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">Carregando dados da ferramenta...</div>

    <!-- Formulário -->
    <form *ngIf="!loading" (ngSubmit)="salvar()" #ferramentaForm="ngForm">
      <div class="form-group">
        <label class="form-label">
          Nome *
          <span class="text-muted">(obrigatório e único)</span>
        </label>
        <input
          type="text"
          class="form-control"
          [class.error]="nomeInput.invalid && nomeInput.touched"
          [(ngModel)]="ferramenta.nome"
          name="nome"
          #nomeInput="ngModel"
          required
          placeholder="Ex: Martelo, Serra, Alicate"
        />
        <div *ngIf="nomeInput.invalid && nomeInput.touched" class="error-message">
          Nome é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Unidade de Medida</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="ferramenta.unidadeMedida"
          name="unidadeMedida"
          placeholder="Ex: unidade, kg, metro"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Quantidade em Estoque</label>
        <input
          type="number"
          class="form-control"
          [class.error]="quantidadeInput.invalid && quantidadeInput.touched"
          [(ngModel)]="ferramenta.quantidadeEmEstoque"
          name="quantidadeEmEstoque"
          #quantidadeInput="ngModel"
          min="0"
          step="0.01"
          placeholder="0"
          required
        />
        <div *ngIf="quantidadeInput.invalid && quantidadeInput.touched" class="error-message">
          <div *ngIf="quantidadeInput.errors?.['required']">Quantidade é obrigatória</div>
          <div *ngIf="quantidadeInput.errors?.['min']">Quantidade não pode ser negativa</div>
        </div>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          mat-raised-button
          color="success"
          [disabled]="loading || ferramentaForm.invalid"
        >
          {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
        </button>
        <button type="button" mat-raised-button color="gray" routerLink="/ferramentas">
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
