<div class="container">
  <div class="card">
    <h2 class="mb-4">{{ editando ? '✏️ Editar' : '➕ Nova' }} Ferramenta</h2>

    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">
      Carregando dados da ferramenta...
    </div>

    <!-- Formulário -->
    <form *ngIf="!loading" (ngSubmit)="salvar()">
      <div class="form-group">
        <label class="form-label">Nome *</label>
        <input 
          type="text" 
          class="form-control"
          [(ngModel)]="ferramenta.nome" 
          name="nome"
          required
          placeholder="Ex: Martelo, Serra, Alicate">
      </div>

      <div class="form-group">
        <label class="form-label">Unidade de Medida</label>
        <input 
          type="text" 
          class="form-control"
          [(ngModel)]="ferramenta.unidadeMedida" 
          name="unidadeMedida"
          placeholder="Ex: unidade, kg, metro">
      </div>

      <div class="form-group">
        <label class="form-label">Quantidade em Estoque</label>
        <input 
          type="number" 
          class="form-control"
          [(ngModel)]="ferramenta.quantidadeEmEstoque" 
          name="quantidadeEmEstoque"
          min="0"
          step="0.01"
          placeholder="0">
      </div>

      <!-- Form actions - responsivo -->
      <div class="form-actions">
        <button type="submit" class="btn btn-success" [disabled]="loading">
          {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
        </button>
        <button type="button" class="btn btn-secondary" routerLink="/ferramentas">
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
