<div class="container">
  <h2>{{ editando ? '✏️ Editar' : '➕ Nova' }} Ferramenta</h2>

  <form (ngSubmit)="salvar()">
    <div class="form-group">
      <label>Nome *</label>
      <input 
        type="text" 
        class="form-control"
        [(ngModel)]="ferramenta.nome" 
        name="nome"
        required
        placeholder="Ex: Martelo, Serra, Alicate">
    </div>

    <div class="form-group">
      <label>Unidade de Medida</label>
      <input 
        type="text" 
        class="form-control"
        [(ngModel)]="ferramenta.unidadeMedida" 
        name="unidadeMedida"
        placeholder="Ex: unidade, kg, metro">
    </div>

    <div class="form-group">
      <label>Quantidade em Estoque</label>
      <input 
        type="number" 
        class="form-control"
        [(ngModel)]="ferramenta.quantidadeEmEstoque" 
        name="quantidadeEmEstoque"
        min="0"
        step="0.01"
        placeholder="0">
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-success">
        {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
      </button>
      <button type="button" class="btn btn-secondary" routerLink="/ferramentas">
        ❌ Cancelar
      </button>
    </div>
  </form>
</div>
