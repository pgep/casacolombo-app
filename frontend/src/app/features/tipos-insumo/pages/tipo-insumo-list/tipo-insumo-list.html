<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">📦 Tipos de Insumo</h2>
      <a mat-raised-button color="success" routerLink="/tipos-insumo/novo"> ➕ Novo Tipo </a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!dataSource.data.length && !loading" class="loading-spinner">
      Carregando tipos de insumo...
    </div>

    <!-- Tabela Material -->
    <mat-card class="example-card" appearance="outlined">
      <mat-card-header>
        <!-- Campo de filtro -->
        <div class="filter-container">
          <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Filtrar</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Digite para filtrar..." />
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0">
          <!-- Coluna ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row" data-label="ID">{{ row.id }}</td>
          </ng-container>

          <!-- Coluna Nome -->
          <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
            <td mat-cell *matCellDef="let row" data-label="Nome">{{ row.nome }}</td>
          </ng-container>

          <!-- Coluna Status -->
          <ng-container matColumnDef="ativo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let row" data-label="Status">
              <span class="status-badge" [class.ativo]="row.ativo" [class.inativo]="!row.ativo">
                {{ row.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
          </ng-container>

          <!-- Coluna Ações -->
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let row" data-label="Ações">
              <button
                mat-icon-button
                matTooltip="Editar Tipo Insumo"
                matTooltipPosition="above"
                [routerLink]="['/tipos-insumo/editar', row.id]"
              >
                <mat-icon color="primary">edit</mat-icon>
              </button>
              <button
                mat-icon-button
                matTooltip="Excluir Tipo Insumo"
                matTooltipPosition="above"
                (click)="deletar(row.id!)"
              >
                <mat-icon color="warm">delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- Linha do cabeçalho -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

          <!-- Linhas de dados -->
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Linha quando não há dados -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="empty-state">Nenhum tipo de insumo encontrado.</div>
            </td>
          </tr>
        </table>
      </mat-card-content>
    </mat-card>

    <!-- Paginador -->
    <mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
