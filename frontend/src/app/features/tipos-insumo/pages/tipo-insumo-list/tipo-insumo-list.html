<div class="container">
  <div class="card">
    <!-- Cabeçalho responsivo -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">📦 Tipos de Insumo</h2>
      <a routerLink="/tipos-insumo/novo" class="btn btn-success btn-novo">➕ Novo Tipo</a>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="loading-spinner">
      Carregando tipos de insumo...
    </div>

    <!-- Tabela Responsiva -->
    <div class="table-responsive" *ngIf="!loading && tipos.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tipos">
            <td data-label="ID">{{ t.id }}</td>
            <td data-label="Nome">{{ t.nome }}</td>
            <td data-label="Status">
              <span class="badge" [ngClass]="t.ativo ? 'badge-success' : 'badge-danger'">
                {{ t.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td data-label="Ações" class="acoes-cell">
              <div class="acoes-container">
                <button class="btn btn-md btn-primary" [routerLink]="['/tipos-insumo/editar', t.id]">
                  ✏️
                </button>
                <button class="btn btn-md btn-danger" (click)="deletar(t.id!)">
                  🗑️
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div *ngIf="!loading && tipos.length === 0" class="empty-state">
      <p>Nenhum tipo de insumo cadastrado.</p>
      <a routerLink="/tipos-insumo/novo" class="btn btn-success">➕ Cadastrar Primeiro Tipo</a>
    </div>
  </div>
</div>
