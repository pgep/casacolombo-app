<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">🏷️ Lista de Tipos de Produto</h2>
      <a routerLink="/tipos-produto/novo" class="btn btn-success">➕ Novo Tipo</a>
    </div>

    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">
      Carregando tipos de produto...
    </div>

    <!-- Tabela -->
    <div class="table-container" *ngIf="!loading && tipos.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tipos">
            <td>{{ t.id }}</td>
            <td>{{ t.nome }}</td>
            <td>
              <span class="badge" [ngClass]="t.ativo ? 'badge-success' : 'badge-danger'">
                {{ t.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td>
              <div class="flex gap-2">
                <button class="btn btn-sm btn-primary" [routerLink]="['/tipos-produto/editar', t.id]">
                  ✏️ Editar
                </button>
                <button class="btn btn-sm btn-danger" (click)="deletar(t.id!)">
                  🗑️ Excluir
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div *ngIf="!loading && tipos.length === 0" class="empty-state">
      Nenhum tipo de produto cadastrado. Clique em "Novo Tipo" para começar!
    </div>
  </div>
</div>
