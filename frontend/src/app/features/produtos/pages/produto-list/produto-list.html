<div class="container">
  <div class="card">
    <!-- Cabeçalho responsivo -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">📦 Lista de Produtos</h2>
      <a routerLink="/produtos/novo" class="btn btn-success btn-novo">➕ Novo Produto</a>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="loading-spinner">Carregando produtos...</div>

    <!-- Tabela Responsiva -->
    <div class="table-responsive" *ngIf="!loading && produtos.length > 0">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Preço</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of produtos">
            <td data-label="ID">{{ p.id }}</td>
            <td data-label="Nome">{{ p.nome }}</td>
            <td data-label="Tipo">{{ p.tipo_nome || '-' }}</td>
            <td data-label="Preço">R$ {{ p.preco_venda | number:'1.2-2' }}</td>
            <td data-label="Status">
              <span class="badge" [ngClass]="p.ativo ? 'badge-success' : 'badge-danger'">
                {{ p.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td data-label="Ações" class="acoes-cell">
              <div class="acoes-container">
                <button class="btn btn-md btn-primary" [routerLink]="['/produtos/editar', p.id]">
                  ✏️
                </button>
                <button class="btn btn-md btn-danger" (click)="deletar(p.id!)">
                  🗑️
                </button>
                <button *ngIf="p.imagem_id" class="btn btn-md btn-info" (click)="verImagem(p)">
                  👁️
                </button>
                <span *ngIf="!p.imagem_id" class="text-muted btn-placeholder">-</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- Empty state -->
    <div *ngIf="!loading && produtos.length === 0" class="empty-state">
      <p>Nenhum produto cadastrado.</p>
      <a routerLink="/produtos/novo" class="btn btn-success">➕ Cadastrar Primeiro Produto</a>
    </div>
  </div>
</div>
