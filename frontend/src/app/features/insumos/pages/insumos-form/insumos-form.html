<div class="container">
  <div class="card">
    <h2 class="mb-4">{{ editando ? '✏️ Editar' : '➕ Nova' }} Insumo</h2>

    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">Carregando dados da ferramenta...</div>

    <form *ngIf="!loading" (ngSubmit)="salvar()" #form="ngForm">
      <div class="form-group">
        <label class="form-label">
          Nome *
          <span class="text-muted">(obrigatório e único)</span>
        </label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="insumo.nome"
          name="nome"
          required
          placeholder="Nome"
        />
      </div>
      <div class="form-group">
        <label class="form-label">Unidade de medida</label>
        <div class="select-with-loading">
          <select
            class="form-control"
            [(ngModel)]="insumo.unidade_medida_id"
            name="unidade"
            required
          >
            <option [ngValue]="null">Selecione...</option>
            <option *ngFor="let u of unidades" [ngValue]="u.id">
              {{ u.nome }}
            </option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">
          Quantidade comprada *
          <span class="text-muted">(obrigatório)</span>
        </label>
        <input
          type="text"
          class="form-control"
          type="number"
          [(ngModel)]="insumo.quantidade_compra"
          name="quantidade"
          placeholder="Quantidade comprada"
          required
        />
      </div>
      <div class="form-group">
        <label class="form-label">
          Valor da compra *
          <span class="text-muted">(obrigatório)</span>
        </label>
        <input
          type="text"
          class="form-control"
          type="number"
          [(ngModel)]="insumo.valor_compra"
          name="valor"
          placeholder="Valor da compra"
          required
        />
      </div>
      <div class="form-actions">
        <button mat-raised-button color="success" [disabled]="loading" type="submit">
          {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
        </button>
        <button type="button" mat-raised-button color="gray" routerLink="/insumos">
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
