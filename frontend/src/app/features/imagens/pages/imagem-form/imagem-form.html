<div class="container">
  <div class="card">
    <h2 class="mb-4">{{ editando ? '✏️ Editar' : '➕ Nova' }} Imagem</h2>

    <div *ngIf="loading" class="loading-spinner">
      Carregando...
    </div>

    <form *ngIf="!loading" (ngSubmit)="salvar()">
      <div class="form-group">
        <label class="form-label">Nome *</label>
        <input 
          type="text" 
          class="form-control"
          [(ngModel)]="imagem.nome" 
          name="nome"
          required
          placeholder="Ex: Foto do produto, Logo, etc.">
      </div>

      <div class="form-group">
        <label class="form-label">Arquivo de Imagem *</label>
        <input 
          type="file" 
          class="form-control"
          (change)="onFileSelected($event)"
          accept="image/*"
          [disabled]="editando && !arquivoSelecionado">
        <small class="text-muted">Formatos aceitos: JPG, PNG, GIF</small>
      </div>

      <!-- Preview da imagem -->
      <div *ngIf="previewUrl" class="preview-container">
        <h4>Preview:</h4>
        <img [src]="previewUrl" class="preview-image">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success" [disabled]="loading">
          {{ editando ? '💾 Atualizar' : '💾 Salvar' }}
        </button>
        <button type="button" class="btn btn-secondary" routerLink="/imagens">
          ❌ Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
