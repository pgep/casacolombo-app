<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">🖼️ Lista de Imagens</h2>
      <a mat-raised-button color="success" routerLink="/imagens/novo"> ➕ Nova Imagem </a>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="loading-spinner">Carregando imagens...</div>

    <!-- Tabela Material com thumbnail -->
    <div *ngIf="!loading && dataSource.data.length > 0" class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z0">
        <!-- Coluna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let row" data-label="ID">{{ row.id }}</td>
        </ng-container>

        <!-- Coluna Nome -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
          <td mat-cell *matCellDef="let row" data-label="Nome">{{ row.nome }}</td>
        </ng-container>

        <!-- Coluna Data -->
        <ng-container matColumnDef="data">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Data</th>
          <td mat-cell *matCellDef="let row" data-label="Data">
            {{ row.created_at | date: 'dd/MM/yyyy' }}
          </td>
        </ng-container>

        <!-- Coluna Thumbnail (mini imagem) -->
        <ng-container matColumnDef="thumbnail">
          <th mat-header-cell *matHeaderCellDef>Imagem</th>
          <td mat-cell *matCellDef="let row" data-label="Imagem">
            <div class="thumbnail-container" *ngIf="row.thumbnail">
              <img
                [src]="row.thumbnail"
                [alt]="row.nome"
                class="thumbnail-img"
                (click)="verImagemCompleta(row)"
                title="Clique para ampliar"
              />
            </div>
            <span *ngIf="!row.thumbnail" class="text-muted">-</span>
          </td>
        </ng-container>

        <!-- Coluna Ações -->
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let row" data-label="Ações">
            <button
              mat-icon-button
              matTooltip="Editar Imagem"
              matTooltipPosition="above"
              [routerLink]="['/imagens/editar', row.id]"
            >
              <mat-icon color="primary">edit</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Excluir imagem"
              matTooltipPosition="above"
              color="warn"
              (click)="deletar(row.id!)"
            >
              <mat-icon color="warm">delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Cabeçalho -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <!-- Dados -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <!-- Vazio -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div class="empty-state">Nenhuma imagem encontrada.</div>
          </td>
        </tr>
      </table>

      <!-- Paginador -->
      <mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && dataSource.data.length === 0" class="empty-state">
      <p>Nenhuma imagem cadastrada.</p>
      <a mat-raised-button color="primary" routerLink="/imagens/novo">
        ➕ Cadastrar Primeira Imagem
      </a>
    </div>
  </div>
</div>
