<div class="container">
  <div class="card">
    <!-- Cabeçalho responsivo -->
    <div class="list-header">
      <h2 class="card-titulo">🖼️ Lista de Imagens</h2>
      <a routerLink="/imagens/novo" class="btn btn-success btn-novo">➕ Nova Imagem</a>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="loading-spinner">
      Carregando imagens...
    </div>

    <!-- Grid de imagens responsivo -->
    <div *ngIf="!loading && imagens.length > 0" class="imagens-grid">
      <div *ngFor="let img of imagens" class="imagem-card">
        <div class="imagem-preview">
          <img [src]="getBase64Image(img.imagem_base64)" [alt]="img.nome">
        </div>
        <div class="imagem-info">
          <h3>{{ img.nome }}</h3>
          <small>{{ img.created_at | date:'dd/MM/yyyy' }}</small>
        </div>
        <div class="imagem-actions">
          <button class="btn btn-sm btn-primary" [routerLink]="['/imagens/editar', img.id]">
            ✏️
          </button>
          <button class="btn btn-sm btn-danger" (click)="deletar(img.id!)">
            🗑️
          </button>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && imagens.length === 0" class="empty-state">
      <p>Nenhuma imagem cadastrada.</p>
      <a routerLink="/imagens/novo" class="btn btn-success">➕ Cadastrar Primeira Imagem</a>
    </div>
  </div>
</div>
