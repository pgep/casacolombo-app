<div class="container">
  <div class="card">
    <div class="flex justify-between items-center mb-4">
      <h2 class="card-titulo">🖼️ Lista de Imagens</h2>
      <a mat-raised-button color="success" routerLink="/imagens/novo"> ➕ Nova Imagem </a>
    </div>

    <!-- Loading state -->
    <div *ngIf="!dataSource.data.length && !loading" class="loading-spinner">
      Carregando imagens...
    </div>

    <!-- Grid de imagens responsivo com Material Cards -->
    <div *ngIf="!loading && dataSource.data.length > 0" class="imagens-grid">
      <mat-card *ngFor="let img of dataSource.data" class="imagem-card">
        <mat-card-header>
          <h3>{{ img.nome }}</h3>
          <!-- <small>{{ img.created_at | date: 'dd/MM/yyyy' }}</small> -->
        </mat-card-header>
        <mat-card-content class="imagem-info">
          <div class="imagem-preview">
            <img [src]="getBase64Image(img.imagem_base64)" [alt]="img.nome" />
          </div>
        </mat-card-content>
        <mat-card-actions class="imagem-actions">
          <button mat-icon-button color="primary" [routerLink]="['/imagens/editar', img.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletar(img.id!)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && dataSource.data.length === 0" class="empty-state">
      <p>Nenhuma imagem cadastrada.</p>
      <a mat-raised-button color="primary" routerLink="/imagens/novo"
        >➕ Cadastrar Primeira Imagem</a
      >
    </div>
  </div>
</div>
